<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registeration To-do-app</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./registeration.css" />
  </head>
  <body>
    <div class="container-fluid d-flex vh-100">
      <div
        class="w-100 w-sm-50 d-flex justify-content-center align-items-center"
      >
        <div
          class="form d-flex flex-column align-items-center pt-4 h-50 w-80 w-sm-50 gap-3"
        >
          <h1 class="font-monospace">Registeration</h1>
          <input
            id="name"
            class="w-100 p-2 border-black rounded"
            type="text"
            placeholder="Enter your full name"
          />
          <input
            id="email"
            class="w-100 p-2 border-black rounded"
            type="email"
            placeholder="Enter your email"
          />
          <input
            id="password"
            class="w-100 p-2 border-black rounded"
            type="password"
            placeholder="Enter your password"
          />
          <button
            id="register-btn"
            class="w-100 p-2 border-0 rounded-3 text-light"
            style="background-color: rgb(2, 166, 255)"
          >
            Register
          </button>
          <p class="small">
            Already have an account?
            <a href="../index.html" class="text-decoration-none">SignIn</a>
          </p>
        </div>
      </div>

      <div class="d-none d-sm-block w-sm-50">
        <img
          class="w-100 h-100 object-fit-cover"
          src="./registeration-image.jpg"
          alt=""
        />
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../javascript/register.js"></script>
  </body>
</html>
